workflows:
  android_ci:
    name: Android CI (Analyze + Test + Build)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      vars:
        COVERAGE_MIN_EFFECTIVE: "38.0"
      android_signing:
        - upload_keystore
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Flutter version
        script: flutter --version
      - name: Install dependencies
        script: flutter pub get
      - name: Prepare Android signing config
        script: |
          if [ -n "$CM_KEYSTORE_PATH" ] && [ -n "$CM_KEYSTORE_PASSWORD" ] && [ -n "$CM_KEY_ALIAS" ] && [ -n "$CM_KEY_PASSWORD" ]; then
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n" \
              "$CM_KEYSTORE_PASSWORD" \
              "$CM_KEY_PASSWORD" \
              "$CM_KEY_ALIAS" \
              "$CM_KEYSTORE_PATH" > android/key.properties
            echo "Android signing is configured from Codemagic keystore."
          else
            echo "Codemagic keystore env vars are missing; build will use fallback signing."
          fi
      - name: Static analysis
        script: flutter analyze
      - name: Run tests
        script: flutter test --coverage --reporter expanded
      - name: Coverage summary
        script: python3 tool/coverage_summary.py --input coverage/lcov.info --out coverage/summary.txt --json coverage/summary.json --min-effective "${COVERAGE_MIN_EFFECTIVE:-38.0}"
      - name: Build release APK
        script: flutter build apk --release
      - name: Build release AAB
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
      - coverage/lcov.info
      - coverage/summary.txt
      - coverage/summary.json
